name: PR pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZAP_FILE: "zap-scan-pr-${{ github.event.number }}"

# for security reasons the github actions are pinned to specific SHAs
jobs:
  md_linter:
    name: Lint docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout markdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          config: '.markdownlint.yaml'
          globs: |
            docs/*.md
            docs/**/*.md
            td.vue/*.md
            td.server/*.md
            *.md

  link_checker:
    name: Link checker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout markdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # https://github.com/lycheeverse/lychee-action?tab=readme-ov-file#utilising-the-cache-feature
      # Using a cache helps prevent rate-limiting and other failures
      # This is cached only per-commit, and is intended to help
      # with re-runs
      - name: Restore lychee cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 1
            --retry-wait-time 10
            --cache
            'docs/**/*.md'
            'docs/*.md'
            '*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  spell_checker:
    name: Check spelling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout markdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Spell check EN language
        uses: rojopolis/spellcheck-github-actions@26a39cd487140d628757554605a8ad02f9f7caf8 # 0.64.0
        with:
          config_path: .spellcheck.yaml

  server_quality:
    name: Server quality
    uses: ./.github/workflows/server-quality-gates.yaml

  site_quality:
    name: Site quality
    uses: ./.github/workflows/site-quality-gates.yaml

  desktop_quality:
    name: Desktop quality
    uses: ./.github/workflows/desktop-quality-gates.yaml

  web_e2e:
    name: Local web e2e
    needs: [server_quality, site_quality]
    uses: ./.github/workflows/web-e2e.yaml
    secrets:
      github-client-id: ${{ secrets.CI_GITHUB_CLIENT_ID }}
      github-client-secret: ${{ secrets.CI_GITHUB_CLIENT_SECRET }}
      jwt-refresh-signing-key: ${{ secrets.CI_JWT_REFRESH_SIGNING_KEY }}
      jwt-signing-key: ${{ secrets.CI_JWT_SIGNING_KEY }}
      session-encryption-keys: ${{ secrets.CI_SESSION_ENCRYPTION_KEYS }}

  desktop_e2e:
    name: Desktop e2e smokes
    needs: [site_quality, desktop_quality]
    uses: ./.github/workflows/desktop-e2e.yaml
    with:
      include-macos-and-windows: true

  visual_regression_tests:
    name: Site visual regression
    runs-on: ubuntu-24.04
    needs: site_quality
    env:
      GITHUB_CLIENT_ID: ${{ secrets.CI_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.CI_GITHUB_CLIENT_SECRET }}
      ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.CI_JWT_REFRESH_SIGNING_KEY }}
      ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.CI_JWT_SIGNING_KEY }}
      ENCRYPTION_KEYS: ${{ secrets.CI_SESSION_ENCRYPTION_KEYS }}
      NODE_ENV: development
      SERVER_API_PROTOCOL: http
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            td.vue/package-lock.json
            td.server/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Use Chrome 148
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          chrome-version: '148.0.7778.96'

      - name: Install front-end
        run: npm clean-install

      - name: Install server
        working-directory: td.server
        run: npm clean-install

      - name: Pre Dev
        run: npm run predev

      - name: Start server
        working-directory: td.server
        run: npm run start:server

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-artifacts
          path: |
            td.vue/tests/e2e/visual/screenshots
            td.vue/tests/e2e/visual/diffs
          if-no-files-found: ignore
        if: ${{ failure() }}

  zap_scan_web_app:
    name: Local ZAP scan
    runs-on: ubuntu-24.04
    needs: [server_quality, site_quality]
    env:
      GITHUB_CLIENT_ID: ${{ secrets.CI_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.CI_GITHUB_CLIENT_SECRET }}
      ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.CI_JWT_REFRESH_SIGNING_KEY }}
      ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.CI_JWT_SIGNING_KEY }}
      ENCRYPTION_KEYS: ${{ secrets.CI_SESSION_ENCRYPTION_KEYS }}
      NODE_ENV: development
      SERVER_API_PROTOCOL: http

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            td.server/package-lock.json
            td.vue/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Clean install
        run: |
          npm clean-install --ignore-scripts
          cd td.server
          npm clean-install
          cd ../td.vue
          npm clean-install

      - name: Build and run locally
        run: npm start

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          rules_file_name: '.github/workflows/.zap-rules-web.tsv'
          allow_issue_writing: false
          fail_action: false
          artifact_name: ${{ env.ZAP_FILE }}
          cmd_options: '-a'

  build_docker_image:
    name: Docker image
    if: github.repository == 'OWASP/threat-dragon'
    needs: [server_quality, site_quality]
    uses: ./.github/workflows/docker-build.yaml
    with:
      image-tags: pr-${{ github.event.number }}
      export-image-artifact: true
      image-artifact-name: pr-${{ github.event.number }}

  scan_image_with_trivy:
    name: Trivy scan
    runs-on: ubuntu-24.04
    needs: build_docker_image
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Retrieve local Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-${{ github.event.number }}
          path: /tmp

      - name: Load local Docker image
        run: docker load --input "$IMAGE_ARCHIVE"
        env:
          IMAGE_ARCHIVE: /tmp/pr-${{ github.event.number }}.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pr-${{ github.event.number }}
          format: table
          trivyignores: '.github/workflows/.trivyignore'
          exit-code: 1
          skip-files: '/app/docs/configure/bitbucket.html,/app/docs/assets/search.json'

  pr_required_checks:
    name: PR required checks
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - md_linter
      - link_checker
      - spell_checker
      - server_quality
      - site_quality
      - desktop_quality
      - web_e2e
      - desktop_e2e
      - visual_regression_tests
      - zap_scan_web_app
      - build_docker_image

    steps:
      - name: Require every blocking PR job to pass
        shell: bash
        run: |
          results=(
            "${{ needs.md_linter.result }}"
            "${{ needs.link_checker.result }}"
            "${{ needs.spell_checker.result }}"
            "${{ needs.server_quality.result }}"
            "${{ needs.site_quality.result }}"
            "${{ needs.desktop_quality.result }}"
            "${{ needs.web_e2e.result }}"
            "${{ needs.desktop_e2e.result }}"
            "${{ needs.visual_regression_tests.result }}"
            "${{ needs.zap_scan_web_app.result }}"
            "${{ needs.build_docker_image.result }}"
          )

          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "A required PR job did not succeed." >&2
              exit 1
            fi
          done
