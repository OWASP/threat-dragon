name: Housekeeping
on:
  # Run daily at 6:45
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

# for security reasons the github actions are pinned to specific SHAs
jobs:
  chores:
    name: Tidy workflows
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete stale workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 28
          keep_minimum_runs: 10

  stale:
    name: Tidy pull requests
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Tidy stale PRs and issues
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-issue-stale: 183
          days-before-issue-close: -1
          stale-issue-message: 'This issue is stale because it has been open for 6 months with no activity'
          stale-issue-label: stale
          remove-issue-stale-when-updated: true
          days-before-pr-stale: 21
          days-before-pr-close: 7
          stale-pr-message: 'This PR is stale because it has been open 21 days with no activity. Remove stale label, or add a comment, otherwise it will be closed in 7 days'
          close-pr-message: 'This PR was closed because it has been stalled for 4 weeks with no activity'

  trivy:
    name: Scan with Trivy
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/vulnerability-scan.yaml
    with:
      source: registry
      image-ref: threatdragon/owasp-threat-dragon:latest
      checkout-ref: main
      upload-sarif: true

  link_checker:
    name: Link checker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout markdown
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 1
            --retry-wait-time 10
            'docs/**/*.md'
            'docs/*.md'
            '*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
