name: Reusable Vue quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    name: Site quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use node LTS 24.16
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.16'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Install clean packages
        run: npm clean-install

      - name: Site lint
        run: npm run lint

      - name: Site unit test
        run: npm run test:unit

  desktop:
    name: Desktop quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use node LTS 24.16
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.16'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Install clean packages
        run: npm clean-install

      - name: Desktop lint
        run: npm run lint:desktop

      - name: Desktop unit test
        run: npm run test:desktop
