name: Reusable web end-to-end tests

on:
  workflow_call:
    inputs:
      container:
        description: Test the container image instead of the local development server
        required: false
        type: boolean
        default: false
      image-name:
        description: Container image reference
        required: false
        type: string
        default: ''
    secrets:
      github-client-id:
        required: false
      github-client-secret:
        required: false
      jwt-refresh-signing-key:
        required: false
      jwt-signing-key:
        required: false
      session-encryption-keys:
        required: false

permissions:
  contents: read

jobs:
  local_smokes:
    name: Local site e2e smokes
    if: inputs.container == false
    runs-on: ubuntu-24.04
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
      GITHUB_CLIENT_ID: ${{ secrets.github-client-id }}
      GITHUB_CLIENT_SECRET: ${{ secrets.github-client-secret }}
      ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.jwt-refresh-signing-key }}
      ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.jwt-signing-key }}
      ENCRYPTION_KEYS: ${{ secrets.session-encryption-keys }}
      NODE_ENV: development
      SERVER_API_PROTOCOL: http
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Cache Cypress binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CYPRESS_CACHE_FOLDER }}
          key: ${{ runner.os }}-cypress-${{ hashFiles('td.vue/package-lock.json') }}

      - name: Install front-end
        run: npm clean-install

      - name: Build and run locally
        run: npm run start:serve

      - name: Run e2e tests
        run: npm run test:e2e-pr-smokes

      - name: Upload e2e videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e_vids.zip
          path: tests/e2e/videos
        if: ${{ failure() && hashFiles('tests/e2e/videos/') != '' }}

  local_tests:
    name: Local site e2e tests
    if: inputs.container == false
    needs: local_smokes
    runs-on: ubuntu-24.04
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
      GITHUB_CLIENT_ID: ${{ secrets.github-client-id }}
      GITHUB_CLIENT_SECRET: ${{ secrets.github-client-secret }}
      ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.jwt-refresh-signing-key }}
      ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.jwt-signing-key }}
      ENCRYPTION_KEYS: ${{ secrets.session-encryption-keys }}
      NODE_ENV: development
      SERVER_API_PROTOCOL: http
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Cache Cypress binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CYPRESS_CACHE_FOLDER }}
          key: ${{ runner.os }}-cypress-${{ hashFiles('td.vue/package-lock.json') }}

      - name: Install front-end
        run: npm clean-install

      - name: Build and run locally
        run: npm run start:serve

      - name: Run e2e tests
        run: npm run test:e2e-pr

      - name: Upload e2e videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e_vids.zip
          path: tests/e2e/videos
        if: ${{ failure() && hashFiles('tests/e2e/videos/') != '' }}

  container_smokes:
    name: Site e2e smokes
    if: inputs.container
    runs-on: ubuntu-24.04
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Threat Dragon
        working-directory: .
        run: |
          docker run -d \
            -p 3000:3000 \
            -e ENCRYPTION_JWT_REFRESH_SIGNING_KEY \
            -e ENCRYPTION_JWT_SIGNING_KEY \
            -e ENCRYPTION_KEYS \
            -e GITHUB_CLIENT_ID \
            -e GITHUB_CLIENT_SECRET \
            -e NODE_ENV=development \
            -e SERVER_API_PROTOCOL=http \
            "${{ inputs.image-name }}"
        env:
          ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.jwt-refresh-signing-key }}
          ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.jwt-signing-key }}
          ENCRYPTION_KEYS: ${{ secrets.session-encryption-keys }}
          GITHUB_CLIENT_ID: ${{ secrets.github-client-id }}
          GITHUB_CLIENT_SECRET: ${{ secrets.github-client-secret }}

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Cache Cypress binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CYPRESS_CACHE_FOLDER }}
          key: ${{ runner.os }}-cypress-${{ hashFiles('td.vue/package-lock.json') }}

      - name: Install clean packages
        run: npm clean-install

      - name: Run e2e tests
        run: npm run test:e2e-ci-smokes

      - name: Upload e2e videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e_vids.zip
          path: td.vue/tests/e2e/videos
        if: ${{ failure() && hashFiles('td.vue/tests/e2e/videos/') != '' }}

  container_tests:
    name: Site e2e tests
    if: inputs.container
    needs: container_smokes
    runs-on: ubuntu-24.04
    env:
      CI_MOCK_ENABLED: 'false'
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/cypress
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Threat Dragon
        working-directory: .
        run: |
          docker run -d \
            -p 3000:3000 \
            -e GITHUB_CLIENT_ID \
            -e GITHUB_CLIENT_SECRET \
            -e ENCRYPTION_JWT_REFRESH_SIGNING_KEY \
            -e ENCRYPTION_JWT_SIGNING_KEY \
            -e ENCRYPTION_KEYS \
            -e NODE_ENV=development \
            -e SERVER_API_PROTOCOL=http \
            "${{ inputs.image-name }}"
        env:
          GITHUB_CLIENT_ID: ${{ secrets.github-client-id }}
          GITHUB_CLIENT_SECRET: ${{ secrets.github-client-secret }}
          ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.jwt-refresh-signing-key }}
          ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.jwt-signing-key }}
          ENCRYPTION_KEYS: ${{ secrets.session-encryption-keys }}

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Cache Cypress binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CYPRESS_CACHE_FOLDER }}
          key: ${{ runner.os }}-cypress-${{ hashFiles('td.vue/package-lock.json') }}

      - name: Install clean packages
        run: npm clean-install

      - name: Run e2e tests
        run: npm run test:e2e-ci

      - name: Upload e2e videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e_vids.zip
          path: td.vue/tests/e2e/videos
        if: ${{ failure() && hashFiles('td.vue/tests/e2e/videos/') != '' }}
