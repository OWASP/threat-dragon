name: Reusable desktop build

on:
  workflow_call:
    inputs:
      target:
        description: Desktop platform to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Desktop build (${{ inputs.target }})
    runs-on: ${{ fromJSON('{"windows":"windows-latest","macos":"macos-latest","linux":"ubuntu-24.04","snap":"ubuntu-24.04"}')[inputs.target] }}
    defaults:
      run:
        working-directory: td.vue
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use node LTS 24.16
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.16'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.electron_config_cache }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('td.vue/package-lock.json') }}

      - name: Install clean packages
        run: npm clean-install

      - name: Build Windows executable
        if: inputs.target == 'windows'
        run: npm run build:desktop -- --windows --publish never

      - name: Build macOS disk image
        if: inputs.target == 'macos'
        run: npm run build:desktop -- --mac --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Linux installers
        if: inputs.target == 'linux'
        shell: bash
        run: npm run build:desktop -- --linux AppImage deb rpm --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Linux snap
        if: inputs.target == 'snap'
        shell: bash
        run: npm run build:desktop -- --linux snap
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Print logs on error
        if: ${{ failure() && (inputs.target == 'macos' || inputs.target == 'linux' || inputs.target == 'snap') }}
        shell: bash
        run: find . -name "*.log" -exec cat '{}' \; -print

      - name: Save desktop SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms-desktop-${{ inputs.target == 'snap' && 'linux-snap' || inputs.target }}-site
          path: './td.vue/dist-desktop/bundled/.sbom/*'
          include-hidden-files: true
          if-no-files-found: error
