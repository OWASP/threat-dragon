name: CI pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HEROKU_APP: threatdragon-v2
  HEROKU_EMAIL: jon.gadsden@owasp.org
  HEROKU_HEALTH: https://www.threatdragon.com/healthz
  # threatdragon is the working area on docker hub so use this area
  # owasp/threat-dragon is the final release area so DO NOT use that
  IMAGE_NAME: threatdragon/owasp-threat-dragon:latest
  ZAP_FILE: zap-scan-push

# for security reasons the github actions are pinned to specific SHAs
jobs:
  server_quality:
    name: Server quality
    uses: ./.github/workflows/server-quality-gates.yaml
    with:
      generate-sbom: true

  site_quality:
    name: Site quality
    uses: ./.github/workflows/site-quality-gates.yaml

  desktop_quality:
    name: Desktop quality
    uses: ./.github/workflows/desktop-quality-gates.yaml

  build_docker_image:
    name: Latest Docker image
    if: github.repository == 'OWASP/threat-dragon'
    needs: [site_quality, server_quality]
    uses: ./.github/workflows/docker-build.yaml
    with:
      image-tags: threatdragon/owasp-threat-dragon:latest
      push-image: true
      generate-sbom: true
      use-qemu: true
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  heroku_deploy:
    name: Upload to Heroku
    runs-on: ubuntu-22.04      # ubuntu-24.04 does not have heroku cli, yet
    needs: build_docker_image

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: akhileshns/heroku-deploy@1b080913896a5d6d44a18e9e208f8eb1fee9b0f7 # v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ env.HEROKU_APP }}
          heroku_email: ${{ env.HEROKU_EMAIL }}
          healthcheck: ${{ env.HEROKU_HEALTH }}
          rollbackonhealthcheckfailed: true
          usedocker: true

  browserstack_smoke_test:
    name: Browserstack smoke test
    runs-on: ubuntu-24.04
    needs: heroku_deploy
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: td.vue/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install clean packages
        run: npm clean-install

      - name: BrowserStack Env Setup
        uses: browserstack/github-actions/setup-env@93aebce225b754566349151c0676b26b005e591b # v1.0.4
        with:
          username:  ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Run cross-browser smoke tests
        run: npm run test:e2e-smokes

  desktop_e2e:
    name: Desktop e2e smokes
    needs: [site_quality, desktop_quality]
    uses: ./.github/workflows/desktop-e2e.yaml

  web_e2e:
    name: Container web e2e
    needs: build_docker_image
    uses: ./.github/workflows/web-e2e.yaml
    with:
      container: true
      image-name: threatdragon/owasp-threat-dragon:latest
    secrets:
      github-client-id: ${{ secrets.CI_GITHUB_CLIENT_ID }}
      github-client-secret: ${{ secrets.CI_GITHUB_CLIENT_SECRET }}
      jwt-refresh-signing-key: ${{ secrets.CI_JWT_REFRESH_SIGNING_KEY }}
      jwt-signing-key: ${{ secrets.CI_JWT_SIGNING_KEY }}
      session-encryption-keys: ${{ secrets.CI_SESSION_ENCRYPTION_KEYS }}

  zap_scan_web_app:
    name: Container ZAP scan
    runs-on: ubuntu-24.04
    needs: build_docker_image

    steps:
      - name: Run Threat Dragon
        run: |
          docker run -d \
            -p 3000:3000 \
            -e GITHUB_CLIENT_ID \
            -e GITHUB_CLIENT_SECRET \
            -e ENCRYPTION_JWT_REFRESH_SIGNING_KEY \
            -e ENCRYPTION_JWT_SIGNING_KEY \
            -e ENCRYPTION_KEYS \
            -e NODE_ENV=development \
            -e SERVER_API_PROTOCOL=http \
            "${{ env.IMAGE_NAME }}"
        env:
          GITHUB_CLIENT_ID: ${{ secrets.CI_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CI_GITHUB_CLIENT_SECRET }}
          ENCRYPTION_JWT_REFRESH_SIGNING_KEY: ${{ secrets.CI_JWT_REFRESH_SIGNING_KEY }}
          ENCRYPTION_JWT_SIGNING_KEY: ${{ secrets.CI_JWT_SIGNING_KEY }}
          ENCRYPTION_KEYS: ${{ secrets.CI_SESSION_ENCRYPTION_KEYS }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          rules_file_name: '.github/workflows/.zap-rules-web.tsv'
          allow_issue_writing: false
          fail_action: true
          artifact_name: ${{ env.ZAP_FILE }}
          cmd_options: '-a'

  scan_image_with_trivy:
    name: Trivy scan
    needs: build_docker_image
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/vulnerability-scan.yaml
    with:
      image-ref: threatdragon/owasp-threat-dragon:latest

  desktop_builds:
    name: Desktop builds
    needs: [site_quality, desktop_quality, desktop_e2e]
    uses: ./.github/workflows/desktop-build.yaml

  sbom_combiner_test:
    name: SBOM combiner test
    runs-on: ubuntu-24.04
    needs:
      - server_quality
      - desktop_builds
      - build_docker_image
    steps:
      - name: Fetch prepared SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'sboms-*'
          merge-multiple: false
          path: 'raw/'

      - name: Fetch SBOMs
        run: |
          set -eux
          mkdir -p sboms/threat-dragon-container-image/app/
          cp raw/sboms-server/sbom.json                 sboms/threat-dragon-server-bom.json
          cp raw/sboms-server/sbom.xml                  sboms/threat-dragon-server-bom.xml
          cp raw/sboms-desktop-windows-site/bom.json    sboms/threat-dragon-desktop-windows-site-bom.json
          cp raw/sboms-desktop-windows-site/bom.xml     sboms/threat-dragon-desktop-windows-site-bom.xml
          cp raw/sboms-desktop-macos-site/bom.json      sboms/threat-dragon-desktop-macos-site-bom.json
          cp raw/sboms-desktop-macos-site/bom.xml       sboms/threat-dragon-desktop-macos-site-bom.xml
          cp raw/sboms-desktop-linux-site/bom.json      sboms/threat-dragon-desktop-linux-site-bom.json
          cp raw/sboms-desktop-linux-site/bom.xml       sboms/threat-dragon-desktop-linux-site-bom.xml
          cp raw/sboms-desktop-linux-snap-site/bom.json sboms/threat-dragon-desktop-linux-snap-site-bom.json
          cp raw/sboms-desktop-linux-snap-site/bom.xml  sboms/threat-dragon-desktop-linux-snap-site-bom.xml
          cp raw/sboms-container-image-app/*            sboms/threat-dragon-container-image/app/

      - name: Save SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: 'sboms/'
          include-hidden-files: true
