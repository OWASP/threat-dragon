name: Reusable server quality gates

on:
  workflow_call:
    inputs:
      generate-sbom:
        description: Generate and upload the server SBOM
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.server

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use node LTS 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: td.server/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install clean packages
        run: npm clean-install

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test:unit

      - name: Create server SBOM
        if: inputs.generate-sbom
        run: npm run make-sbom

      - name: Save server SBOM
        if: inputs.generate-sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms-server
          path: './td.server/sbom.*'
          include-hidden-files: true
