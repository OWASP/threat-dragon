name: Reusable server quality gates

on:
  workflow_call:
    inputs:
      generate-sbom:
        description: Generate and upload the server SBOM
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.server

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use node LTS 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: td.server/package-lock.json

      - name: Use npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install clean packages
        run: npm clean-install

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test:unit

      - name: Create server SBOM
        if: inputs.generate-sbom
        run: npm run make-sbom

      - name: Save server SBOM
        if: inputs.generate-sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms-server
          path: './td.server/sbom.*'
          include-hidden-files: true
